services:
  # Backend Service
  - type: web
    name: million-list-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 3001

  # Frontend Service
  - type: web
    name: million-list-frontend
    env: static
    buildCommand: cd frontend && npm install && VITE_API_URL=https://$BACKEND_HOST npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: million-list-backend
          property: host
